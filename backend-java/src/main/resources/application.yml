# Milvus 配置
milvus:
  enabled: false
  host: localhost
  port: 19530
  collection:
    name: knowledge_base
  dimension: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

rag:
  base-url: http://localhost:8000
  trigger:
    enabled: true
    endpoint: http://localhost:8000/rag-audit/trigger
    timeout-ms: 180000
    max-retry: 3
    initial-backoff-ms: 1000
    poll-delay-ms: 2000
 
doc:
  parse:
    enabled: true

preview:
  cache:
    path: ${ST_PREVIEW_CACHE_DIR:D:/smart-tender/data/preview-cache}
  converter:
    base-url: http://localhost:8088

audit:
  queue:
    mode: async
    stream-key: queue:audit:tasks
    consumer-group: audit-task-workers
    consumer-name-prefix: worker
    batch-size: 5
    block-ms: 1000
    poll-delay-ms: 500
    max-retry: 3
    dlq-stream-key: queue:audit:tasks:dlq
  sse:
    replay-max-events: 100
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 100
    keep-alive-seconds: 60
  rag:
    enabled: false
    top-k: 2
    provider: stub
    fallback-to-stub: true
    http-enabled: false
  extract:
    provider: stub
    fallback-to-stub: true
    placeholder-enabled: false
  chunk:
    mode: hybrid
    target-length: 1000
    min-length: 800
    max-length: 1200
    overlap-ratio: 0.20
    overlap-min-ratio: 0.15
    overlap-max-ratio: 0.25
    semantic-similarity-threshold: 0.72
    semantic-min-length: 320
    semantic-max-length: 1800
    split-unit: sentence
    title-injection: true
    denoise-enabled: true
    strategy-version: chunk-v1
    stable-id-version: stable-id-v1
  progress:
    doc-extract: 10
    rag: 15
    budget: 25
    demand: 25
    legal: 25
