spring:
  profiles:
    active: prod,embedding
  application:
    name: smart_tender
  config:
    import: optional:classpath:application-embedding.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_tender_system?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "1234"
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: localhost
      port: 6379
      #password: "123456"
      database: 10
      timeout: 10000ms
      jedis:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
    baseline-on-migrate: true
  sql:
    init:
      mode: always
      schema-locations: classpath:audit_task_event.sql #classpath:audit_task.sql,classpath:audit_issue.sql,
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# 文件存储配置
file:
  storage:
    path: ${ST_DATA_ROOT:D:/smart-tender/data}
    tender-dir: ${ST_UPLOAD_TENDER_DIR:tenders}
    knowledge-dir: ${ST_UPLOAD_KB_DIR:knowledge/uploads}

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ithsd.smart_tender.pojo.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
      # 可选：开启参数打印（默认开启，可省略）
    log-parameters: true
      # 可选：开启格式化 SQL（便于阅读）
    pretty-print: true
    
# 服务器配置
server:
  port: 8080

