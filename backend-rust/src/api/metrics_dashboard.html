<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ai-bid Experiments</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   Scientific Light Theme
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#f8f9fb; --bg2:#f0f2f5; --card:#ffffff;
  --border:rgba(0,0,0,0.06); --border2:rgba(0,0,0,0.10);
  --text:#1a1d23; --text2:#5b6578; --text3:#8b95a5;
  --accent:#1d4ed8; --accent-8:rgba(29,78,216,0.08);
  --purple:#5b21b6; --purple-8:rgba(91,33,182,0.08);
  --red:#b91c1c; --red-8:rgba(185,28,28,0.08);
  --amber:#c2410c; --amber-8:rgba(194,65,12,0.08);
  --green:#047857; --green-8:rgba(4,120,87,0.08);
  --radius:6px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'SF Mono','JetBrains Mono','Cascadia Code','Fira Code',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.4;-webkit-font-smoothing:antialiased}
.container{max-width:1340px;margin:0 auto;padding:12px 18px}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.header h1{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:-0.3px}
.header-logo{color:var(--accent)}

.btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--border2);border-radius:4px;background:var(--card);cursor:pointer;font-size:11px;color:var(--text2);font-family:var(--font);transition:all .12s;white-space:nowrap}
.btn:hover{background:var(--bg2);border-color:rgba(0,0,0,0.18);color:var(--text)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#1d4ed8}
.btn.accent2{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn.sm{padding:2px 6px;font-size:10px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg2)}
.btn:disabled{opacity:.35;cursor:default}

.float-bar{position:sticky;bottom:12px;z-index:100;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 16px;background:var(--card);border:1px solid var(--border2);border-radius:6px;margin-top:12px;box-shadow:0 1px 8px rgba(0,0,0,0.06)}
.float-bar span{font-size:12px;color:var(--text2)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:10px 14px}
.card .card-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:500;margin-bottom:2px;display:flex;align-items:center;gap:4px}
.card .card-value{font-size:22px;font-weight:650;color:var(--text);font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.1}
.card .card-value .unit{font-size:12px;font-weight:400;color:var(--text3);margin-left:1px}
.card .card-sub{font-size:10px;color:var(--text3);margin-top:2px}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
th,td{padding:5px 8px;text-align:left;font-size:11px;border-bottom:1px solid var(--border)}
th{background:var(--bg2);font-weight:500;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--text)}
th.sorted{color:var(--accent)}
tr:hover td{background:rgba(29,78,216,0.02)}
tr.selected td{background:var(--accent-8)}

.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;background:var(--bg2);color:var(--text2);margin:1px 2px;cursor:pointer;border:1px solid var(--border)}
.tag:hover{background:var(--bg);color:var(--text)}
.tag .tag-x{margin-left:3px;cursor:pointer;opacity:.4}
.tag .tag-x:hover{opacity:1}
.tag-add{background:transparent;border:1px dashed var(--border2);color:var(--text3)}
.tag-add:hover{color:var(--text)}

.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:500}
.badge::before{content:'';width:6px;height:6px;border-radius:50%}
.badge.high{background:var(--red-8);color:var(--red)} .badge.high::before{background:var(--red)}
.badge.medium{background:var(--amber-8);color:var(--amber)} .badge.medium::before{background:var(--amber)}
.badge.low{background:var(--green-8);color:var(--green)} .badge.low::before{background:var(--green)}
.badge.info{background:rgba(0,0,0,0.04);color:var(--text3)} .badge.info::before{background:var(--text3)}

.chart-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:8px;margin-bottom:12px}
.chart-row.col3{grid-template-columns:repeat(3,1fr)}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.chart-box h3{font-size:10px;margin-bottom:8px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
/* 仅 .chart-row 内的卡片启用等高 flex 布局 */
.chart-row>.chart-box{display:flex;flex-direction:column;min-height:260px}
.chart-row>.chart-box h3{flex-shrink:0}
.chart-row>.chart-box canvas{max-height:300px;flex:1;min-height:0}

/* CSS Readout Bars (standalone use only) */
.readout{margin-bottom:2px}
.readout-row{display:flex;align-items:center;gap:8px;margin-bottom:2px;font-size:10px}
.readout-label{min-width:70px;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.readout-track{flex:1;height:6px;background:rgba(0,0,0,0.04);border-radius:2px;overflow:hidden}
.readout-fill{display:inline-block;height:100%;border-radius:2px;transition:width .3s}
.readout-value{min-width:48px;text-align:right;font-family:var(--mono);font-size:10px;color:var(--text2);font-variant-numeric:tabular-nums}

/* Ratio bar */
.ratio-bar{display:flex;height:6px;border-radius:2px;overflow:hidden;margin-bottom:6px}
.ratio-seg{transition:width .3s}
.ratio-seg.high{background:var(--red)} .ratio-seg.medium{background:var(--amber)}
.ratio-seg.low{background:var(--green)} .ratio-seg.info{background:rgba(0,0,0,0.08)}
.ratio-legend{display:flex;gap:12px;font-size:10px;color:var(--text3);margin-bottom:4px}
.ratio-legend span{display:flex;align-items:center;gap:4px}
.ratio-legend span::before{content:'';width:6px;height:6px;border-radius:50%}
.ratio-legend .high::before{background:var(--red)} .ratio-legend .medium::before{background:var(--amber)}
.ratio-legend .low::before{background:var(--green)} .ratio-legend .info::before{background:rgba(0,0,0,0.2)}

/* Finding cards */
.finding-card{border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;margin-bottom:4px;background:var(--card);cursor:pointer;transition:border-color .12s}
.finding-card .f-header{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.finding-card .f-agent{font-size:10px;color:var(--text3)}
.finding-card .f-body{display:none;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.finding-card.open .f-body{display:block}
.finding-card .f-field{margin-bottom:5px}
.finding-card .f-field .f-key{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.finding-card .f-field .f-val{font-size:11px;margin-top:1px;line-height:1.5;white-space:pre-wrap;word-break:break-word}

/* LLM call log */
.call-row{display:flex;align-items:flex-start;gap:8px;padding:4px 0;border-bottom:1px solid var(--border);font-size:10px}
.call-row .call-turn{min-width:22px;text-align:center;font-weight:600;color:var(--accent);font-family:var(--mono)}
.call-row .call-info{flex:1}
.call-row .call-tools{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.call-tool{padding:1px 4px;border-radius:2px;font-size:9px;background:rgba(0,0,0,0.03);color:var(--text2);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call-tool.waste{background:var(--red-8);color:var(--red)}
.call-tool.ok{background:var(--green-8);color:var(--green)}
.call-row .call-dur{min-width:40px;text-align:right;color:var(--text3);font-size:9px;font-family:var(--mono)}

/* Group */
.group-header{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;cursor:pointer;font-weight:500;font-size:12px}
.group-header:hover{background:var(--bg2)}

/* Verdict */
.verdict{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius);font-size:12px;font-weight:600;margin:6px 0 12px}
.verdict.regression{background:var(--red-8);color:var(--red);border:1px solid rgba(185,28,28,0.18)}
.verdict.tradeoff{background:var(--amber-8);color:var(--amber);border:1px solid rgba(194,65,12,0.18)}
.verdict.improvement{background:var(--green-8);color:var(--green);border:1px solid rgba(4,120,87,0.18)}
.verdict.neutral{background:rgba(0,0,0,0.03);color:var(--text2);border:1px solid var(--border)}

/* Delta */
.delta-up{color:var(--red);font-weight:550}
.delta-down{color:var(--green);font-weight:550}

/* Search */
.search-input{width:100%;max-width:300px;padding:6px 10px;border:1px solid var(--border2);border-radius:var(--radius);font-size:12px;font-family:var(--font);background:var(--card);color:var(--text);outline:none}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-8)}
.search-input::placeholder{color:var(--text3)}

/* Config diff */
.config-diff{font-size:11px;display:flex;flex-wrap:wrap;gap:4px 16px}
.config-diff span{padding:2px 6px;border-radius:3px;background:var(--bg2);color:var(--text2);font-family:var(--mono)}
.config-diff span.changed{background:var(--amber-8);color:var(--amber)}

/* Icons + Helpers */
.icon{width:16px;height:16px;display:inline-block;vertical-align:middle;flex-shrink:0}
.icon-sm{width:12px;height:12px}
.icon-lg{width:20px;height:20px}
a{color:var(--accent);text-decoration:none;font-size:12px}
a:hover{text-decoration:underline}
.hidden{display:none!important}
.run-id{font-family:var(--mono);font-size:10px;color:var(--text3)}
.notes-box{background:var(--bg2);border-radius:4px;padding:8px 10px;font-size:11px;line-height:1.5;white-space:pre-wrap}
.notes-box textarea{width:100%;min-height:60px;padding:6px;border:1px solid var(--border2);border-radius:4px;font-size:11px;font-family:var(--font);resize:vertical;background:var(--bg);color:var(--text)}
.compare-table td.metric{color:var(--accent);font-weight:500;font-size:11px}
.compare-table td{font-family:var(--mono);font-size:11px}
.agent-minibar{margin-bottom:6px}
.agent-minibar .am-row{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.agent-minibar .am-label{font-size:9px;min-width:28px;font-weight:600}
.agent-minibar .am-bar{flex:1;height:7px;background:rgba(0,0,0,0.04);border-radius:2px;overflow:hidden}
.agent-minibar .am-fill{height:100%;border-radius:2px}
.agent-minibar .am-val{font-family:var(--mono);font-size:10px;color:var(--text2);min-width:24px;text-align:right}

.toast{position:fixed;bottom:20px;right:20px;padding:10px 20px;background:var(--text);color:#fff;border-radius:var(--radius);font-size:12px;z-index:999;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){.chart-row,.chart-row.col3{grid-template-columns:1fr}.chart-row>.chart-box{min-height:220px}.cards{grid-template-columns:repeat(2,1fr)}.container{padding:12px 14px}}
</style>
</head>
<body>

<script>
const API='/api/v1/metrics/runs';
let compareSet=new Set(JSON.parse(localStorage.getItem('ai_bid_compare')||'[]'));
let allCharts=[], allRuns=[], searchQuery='', sortKey='timestamp', sortDir=-1;
function registerChart(c){allCharts.push(c);return c}
function destroyCharts(){allCharts.forEach(c=>{try{c.destroy()}catch(e){}});allCharts=[]}

function route(){
  destroyCharts();
  const h=location.hash.slice(1)||'list';
  const p=h.split('/');
  if(p[0]==='detail'&&p[1]) renderDetail(p[1]);
  else if(p[0]==='compare'){const ids=p.slice(1).filter(Boolean);if(ids.length>=2)renderCompare(ids);else renderList()}
  else if(p[0]==='analysis') renderAnalysis();
  else renderList();
}
window.onhashchange=route;

function updateBadge(){
  const el=document.getElementById('compare-badge');
  el.textContent=compareSet.size>0?'已选 '+compareSet.size+' 项':'';
  localStorage.setItem('ai_bid_compare',JSON.stringify([...compareSet]));
}
function toggleCompare(runId,ev){if(ev)ev.stopPropagation();compareSet.has(runId)?compareSet.delete(runId):compareSet.add(runId);updateBadge();route();}
function clearCompare(){compareSet.clear();updateBadge();route();}
function ic(id,cls){cls=cls||'icon';return`<svg class="${cls}"><use href="#i-${id}"/></svg>`}

/* ══════ LIST ═══════════════════════════════════════════════ */
function renderRunRow(r){
  const sel=compareSet.has(r.run_id)?'selected':'';
  const tags=(r.tags||[]).map(t=>`<span class="tag">${esc(t)}<span class="tag-x" onclick="event.stopPropagation();removeTag('${r.run_id}','${esc(t).replace(/'/g,"\\'")}')">&times;</span></span>`).join('')+`<span class="tag tag-add" onclick="event.stopPropagation();addTag('${r.run_id}')">${ic('plus','icon-sm')}</span>`;
  const time=r.timestamp?r.timestamp.slice(0,10)+' '+r.timestamp.slice(11,19):'?';
  const title=r.title||r.run_id.slice(9);
  return`<tr class="${sel}" style="cursor:pointer">
    <td><input type="checkbox" ${sel?'checked':''} onclick="toggleCompare('${r.run_id}',event)"></td>
    <td onclick="event.stopPropagation();editTitle('${r.run_id}','${esc(title).replace(/'/g,"\\'")}')" style="font-weight:500;cursor:text;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="Click to rename">${esc(title)}</td>
    <td onclick="location.hash='detail/${r.run_id}'">${time}</td>
    <td onclick="location.hash='detail/${r.run_id}'" style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.document_name)}">${esc(r.document_name)}</td>
    <td onclick="location.hash='detail/${r.run_id}'">${r.experiment_group||'—'}</td>
    <td onclick="location.hash='detail/${r.run_id}'"><b>${r.total_secs.toFixed(0)}</b>s</td>
    <td onclick="location.hash='detail/${r.run_id}'">${r.llm_calls}</td>
    <td onclick="location.hash='detail/${r.run_id}'" style="font-size:11px">${fmtK(r.tokens_input)}+${fmtK(r.tokens_output)}</td>
    <td onclick="location.hash='detail/${r.run_id}'">${r.cost_cny.toFixed(2)}</td>
    <td onclick="location.hash='detail/${r.run_id}'"><span style="font-weight:500">${r.total_findings}</span>${r.high_findings>0?` <span style="color:var(--red);font-size:10px">H:${r.high_findings}</span>`:''}</td>
    <td onclick="location.hash='detail/${r.run_id}'">${tags}</td>
    <td><button class="btn sm ghost" onclick="event.stopPropagation();deleteRun('${r.run_id}','${esc(title).replace(/'/g,"\\'")}')" title="Delete" style="color:var(--red)">${ic('trash','icon-sm')}</button></td>
  </tr>`;
}

async function renderList(){
  updateBadge();
  let html='';
  try{
    const res=await fetch(API);const data=await res.json();
    allRuns=(data.runs||[]).map(r=>{r._group=r.experiment_group||'(ungrouped)';return r;});
    if(!allRuns.length){
      html=`<div class="card" style="text-align:center;padding:60px;color:var(--text3)"><div style="font-size:40px;margin-bottom:12px;opacity:.2">${ic('flask','')}</div>暂无实验数据。<br><span style="font-size:11px">运行一次审核后，数据文件将出现在 output/runs/ 目录。</span></div>`;
    }else{
      let runs=allRuns;
      if(searchQuery){const q=searchQuery.toLowerCase();runs=runs.filter(r=>{const t=(r.title||r.run_id).toLowerCase();const d=(r.document_name||'').toLowerCase();const g=(r.tags||[]).join(' ').toLowerCase();const e=(r._group||'').toLowerCase();return t.includes(q)||d.includes(q)||g.includes(q)||e.includes(q);});}
      runs.sort((a,b)=>{let va=a[sortKey],vb=b[sortKey];if(typeof va==='string')va=va||'';if(typeof vb==='string')vb=vb||'';if(va<vb)return -1*sortDir;if(va>vb)return 1*sortDir;return 0;});

      const groups=new Map();
      for(const r of runs){const g=r._group;if(!groups.has(g))groups.set(g,[]);groups.get(g).push(r);}
      const sortedGroups=[...groups.keys()].sort((a,b)=>{if(a==='(ungrouped)')return 1;if(b==='(ungrouped)')return -1;return a.localeCompare(b);});

      html+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
        <input class="search-input" type="text" placeholder="搜索实验..." value="${esc(searchQuery)}" oninput="searchQuery=this.value;renderList()" style="max-width:240px">
        <span style="font-size:12px;color:var(--text3)">${sortedGroups.length} 实验组 &middot; ${runs.length} 次实验</span><span style="flex:1"></span>
        <button class="btn sm" onclick="document.querySelectorAll('.group-body').forEach(el=>el.classList.toggle('hidden'))">展开/折叠</button>
      </div>`;

      if(runs.length===0){html+=`<div class="card" style="text-align:center;padding:40px;color:var(--text3)">没有匹配 "${esc(searchQuery)}" 的实验</div>`;}

      const COLUMNS=[{key:'timestamp',label:'时间'},{key:'document_name',label:'文件'},{key:'experiment_group',label:'实验组'},{key:'total_secs',label:'耗时'},{key:'llm_calls',label:'调用'},{key:'tokens_input',label:'Token'},{key:'cost_cny',label:'成本'},{key:'total_findings',label:'发现'}];
      const th=s=>{const arrow=sortKey===s.key?(sortDir===1?'↑':'↓'):'';const cls=sortKey===s.key?'sorted':'';return`<th class="${cls}" onclick="sortKey='${s.key}';sortDir=sortKey==='${s.key}'?-sortDir:-1;renderList()">${s.label} ${arrow}</th>`;};
      const THEAD=`<thead><tr><th style="width:28px"></th><th onclick="sortKey='title';sortDir=sortKey==='title'?-sortDir:-1;renderList()" style="cursor:pointer">标题</th>${COLUMNS.map(th).join('')}<th>标签</th><th style="width:40px"></th></tr></thead>`;

      for(const group of sortedGroups){
        const gruns=groups.get(group);const gid='g-'+group.replace(/[^a-zA-Z0-9]/g,'');
        html+=`<div style="margin-bottom:10px"><div class="group-header" onclick="document.getElementById('${gid}').classList.toggle('hidden');this.querySelector('.arrow').textContent=document.getElementById('${gid}').classList.contains('hidden')?'▶':'▼'"><span class="arrow" style="font-size:10px;color:var(--text3)">▼</span><span>${ic('group','icon-sm')} ${esc(group)}</span><span style="font-weight:400;color:var(--text3);font-size:11px">${gruns.length} runs</span><span style="flex:1"></span><button class="btn sm ghost" onclick="event.stopPropagation();moveToGroup('${gruns[0].run_id}','${esc(group).replace(/'/g,"\\'")}')" style="font-size:10px">${ic('plus','icon-sm')} 移入</button></div><div id="${gid}" class="group-body"><div class="table-wrap"><table style="border-radius:0;border-top:none">${THEAD}<tbody>${gruns.map(r=>renderRunRow(r)).join('')}</tbody></table></div></div></div>`;
      }
    }
  }catch(e){html=`<div class="card" style="text-align:center;padding:40px;color:var(--red)">Load error: ${esc(e.message)}</div>`;}
  document.getElementById('content').innerHTML=html;
  if(compareSet.size>=2){const bar=document.createElement('div');bar.className='float-bar';bar.id='floatBar';bar.innerHTML=`<span>已选 <b>${compareSet.size}</b> 次</span><button class="btn primary" onclick="location.hash='compare/${[...compareSet].join('/')}'">对比分析</button><button class="btn" onclick="clearCompare()">清除</button>`;document.getElementById('content').appendChild(bar);}
}

/* ══════ DETAIL ═══════════════════════════════════════════════ */

      <span class="run-id">${m.git_branch||'?'}@${m.git_commit||'?'}</span>
      ${eg?`<span style="font-size:11px;color:var(--text3)">${ic('group','icon-sm')} ${esc(eg)}</span>`:''}
      <span style="flex:1"></span>
      <button class="btn sm ${inC?'accent2':''}" onclick="toggleCompare('${runId}')">${inC?ic('check','icon-sm')+'已选':ic('plus','icon-sm')+'对比'}</button>
    </div>
    <div class="cards">
      <div class="card"><div class="card-label">${ic('clock','icon-sm')} 总耗时</div><div class="card-value">${lat.total_wall_clock_secs.toFixed(0)}<span class="unit">s</span></div><div class="card-sub">${esc(m.config.llm_model||'?')} &middot; ${esc(m.config.embed_engine||'?')}</div></div>
      <div class="card"><div class="card-label">${ic('cpu','icon-sm')} LLM 调用</div><div class="card-value">${llm.totals.llm_calls}<span class="unit">次</span></div><div class="card-sub">平均 ${llm.totals.avg_api_duration_ms.toFixed(0)}ms/次 &middot; ${(llm.wasted_call_ratio*100).toFixed(0)}% 浪费</div></div>
      <div class="card"><div class="card-label">${ic('activity','icon-sm')} Token 消耗</div><div class="card-value">${fmtK(llm.totals.tokens_input)}<span class="unit">+${fmtK(llm.totals.tokens_output)}</span></div><div class="card-sub">输入 ${fmtK(llm.totals.tokens_input)} &middot; 输出 ${fmtK(llm.totals.tokens_output)}</div></div>
      <div class="card"><div class="card-label">API 成本</div><div class="card-value">${llm.totals.cost_cny.toFixed(3)}<span class="unit">CNY</span></div><div class="card-sub">${(llm.totals.tokens_input/1000).toFixed(0)}k tok / ¥${llm.totals.cost_cny.toFixed(3)}</div></div>
      <div class="card"><div class="card-label">${ic('alert','icon-sm')} 风险发现</div><div class="card-value">${qual.findings.after_dedup}</div><div class="card-sub">高:${qual.findings.by_severity.high} 中:${qual.findings.by_severity.medium} 低:${qual.findings.by_severity.low} 信息:${qual.findings.by_severity.info}</div></div>
      <div class="card"><div class="card-label">${ic('crosshair','icon-sm')} 审核质量</div><div class="card-value">${(qual.findings.avg_confidence*100).toFixed(0)}<span class="unit">%</span></div><div class="card-sub">平均置信度 &middot; 去重率 ${(qual.findings.dedup_rate).toFixed(0)}%</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:12px">
      <span style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px">标签</span>${tags||'<span style="color:var(--text3);font-size:11px">无</span>'}
      <button class="btn sm ghost" onclick="addTag('${runId}')">${ic('plus','icon-sm')}</button>
      <span style="margin-left:12px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px">实验组</span>
      <span style="font-size:11px;cursor:pointer" onclick="moveToGroup('${runId}','${esc(eg).replace(/'/g,"\\'")}')">${eg?esc(eg):'<span style="color:var(--text3)">设置...</span>'}</span>

function renderFindings(qual){
  const details=qual.findings_detail||[];if(!details.length)return'';
  return`<div class="chart-box" style="margin-bottom:12px"><h3>风险发现 (${details.length}，点击展开)</h3>${details.map(f=>{const sev=(f.severity||'info').toLowerCase();const sevLabel={high:'高',medium:'中',low:'低',info:'信息'}[sev]||sev.toUpperCase();const reason=(f.reason||'').slice(0,1500);const quote=(f.source_quote||'').slice(0,500);return`<div class="finding-card" onclick="this.classList.toggle('open')"><div class="f-header"><span class="badge ${sev}">${sevLabel}</span><span style="font-weight:600;font-size:12px">${esc(f.risk_type||'?')}</span><span class="f-agent">${esc(f.agent||'?')}</span><span style="font-size:10px;color:var(--text3)">置信度 ${(f.confidence||0).toFixed(2)}</span><span style="font-size:10px">${f.no_risk?'<span style="color:var(--green)">合规</span>':'<span style="color:var(--red)">风险</span>'}</span><span style="font-size:10px;color:var(--text3);margin-left:auto">展开</span></div><div class="f-body"><div class="f-field"><div class="f-key">推理理由</div><div class="f-val">${esc(reason)}</div></div>${f.suggestion?`<div class="f-field"><div class="f-key">建议</div><div class="f-val">${esc(f.suggestion)}</div></div>`:''}<div class="f-field"><div class="f-key">法规依据</div><div class="f-val">${esc((f.legal_basis||[]).join('; ')||'无')}</div></div>${quote?`<div class="f-field"><div class="f-key">原文引用</div><div class="f-val" style="background:var(--bg2);padding:8px;border-radius:4px;font-style:italic">${esc(quote)}</div></div>`:''}${f.clause_ids?`<div class="f-field"><div class="f-key">关联条款</div><div class="f-val" style="font-family:var(--mono);font-size:11px;color:var(--text3)">${esc((f.clause_ids||[]).join(', '))}</div></div>`:''}</div></div>`;}).join('')}</div>`;
}

function renderCallLog(llm){
  const log=llm.call_log||[];if(!log.length)return'';
  const byAgent={};log.forEach(c=>{if(!byAgent[c.agent_name])byAgent[c.agent_name]=[];byAgent[c.agent_name].push(c);});
  let html='';
  for(const[agent,calls]of Object.entries(byAgent)){
    html+=`<div style="margin-bottom:12px"><div style="font-weight:500;font-size:12px;margin-bottom:6px;color:var(--text2)">${esc(agent)} <span style="color:var(--text3);font-weight:400;font-size:10px">${calls.length} calls</span></div>`;
    html+=calls.map((c,i)=>{const tools=c.tools_called||[],args=c.tool_args||[];const toolTags=tools.map((t,j)=>{const arg=args[j]||'';let cls='';if(t==='output_finding'&&c.finding_parsed_ok)cls='ok';else if(t==='output_finding'&&!c.finding_parsed_ok)cls='waste';return`<span class="call-tool ${cls}" title="${esc(arg||t)}">${esc(arg?t+': '+arg:t)}</span>`;}).join('');const icon=c.produced_finding?(c.finding_parsed_ok?'<span style="color:var(--green)">OK</span>':'<span style="color:var(--red)">FAIL</span>'):'<span style="color:var(--text3)">&rarr;</span>';const thought=c.thought_preview||'';const cid='call-'+agent.replace(/[^a-zA-Z0-9]/g,'')+'-'+i;return`<div class="call-row" style="cursor:${thought?'pointer':'default'}" onclick="${thought?`document.getElementById('${cid}').classList.toggle('open')`:''}"><div class="call-turn">T${c.turn}</div><div class="call-info"><div style="display:flex;align-items:center;gap:6px"><span>${icon}</span><span style="font-size:10px;color:var(--text3)">${fmtK(c.tokens_input)}+${fmtK(c.tokens_output)}</span><span class="call-dur">${c.duration_ms}ms</span></div><div class="call-tools">${toolTags||'<span style="color:var(--text3);font-size:10px">(text-only)</span>'}</div>${thought?`<div class="finding-card" id="${cid}" style="margin-top:6px;font-size:11px;border-color:var(--border)"><div class="f-header" style="font-size:10px;color:var(--text3)">${ic('brain','icon-sm')} LLM Reasoning</div><div class="f-body"><div class="f-val">${esc(thought)}</div></div></div>`:''}</div></div>`;}).join('')+'</div>';
  }
  return`<div class="chart-box" style="margin-bottom:12px"><h3>LLM 调用链 (${log.length} 次)</h3>${html}<div style="font-size:10px;color:var(--text3);margin-top:8px">T=轮次 OK=解析成功 FAIL=解析失败 &rarr;=继续探索</div></div>`;
}

function renderAgentTable(llm){
  if(!llm.by_agent)return'';
  let rows='';
  for(const[n,a]of Object.entries(llm.by_agent)){const tools=a.tools?Object.entries(a.tools).map(([k,v])=>`${k}:${v}`).join(' '):'';const wp=a.llm_calls>0?(a.wasted_calls/a.llm_calls*100).toFixed(0):0;rows+=`<tr><td style="font-weight:500">${esc(n)}</td><td>${a.turns||0}t</td><td>${a.llm_calls}</td><td style="font-family:var(--mono);font-size:11px">${fmtK(a.tokens_input)}+${fmtK(a.tokens_output)}</td><td>${a.findings_produced}</td><td style="color:${wp>60?'var(--red)':'var(--text3)'};font-family:var(--mono)">${wp}%</td><td style="font-size:10px;color:var(--text3)">${esc(tools)}</td></tr>`;}
  return`<div class="chart-box" style="margin-bottom:12px"><h3>Agent 详情</h3><div class="table-wrap"><table><thead><tr><th>Agent</th><th>轮次</th><th>调用</th><th>Token</th><th>发现</th><th>浪费</th><th>工具</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ══════ COMPARE + REGRESSION ═════════════════════════════════ */
async function renderCompare(runIds){
  document.getElementById('content').innerHTML=`<div style="text-align:center;padding:60px;color:var(--text3)">加载中...</div>`;
  const runs=[];for(const id of runIds){try{const r=await fetch(`${API}/${id}`).then(r=>r.json());if(!r.error)runs.push(r)}catch(e){}}
  if(runs.length<2){location.hash='list';return}
  runs.sort((a,b)=>(a.meta.timestamp||'').localeCompare(b.meta.timestamp||''));
  const labels=runs.map(r=>{const m=r.meta;return(m.title||m.run_id.slice(9))+(m.tags||[]).length?' ['+m.tags.join(',')+']':'';});
  const configs=runs.map(r=>r.meta.config||{});

  // Config diff
  const configKeys=['llm_model','embed_engine','search_backend','coordinator_enabled','agent_count','max_parallel_clauses'];
  let configDiff='';
  const allSame=configKeys.every(k=>{const v0=configs[0][k];return configs.every(c=>c[k]===v0);});
  if(!allSame){configDiff=configKeys.map(k=>{const vals=configs.map(c=>String(c[k]??'?'));const same=vals.every(v=>v===vals[0]);return`<span class="${same?'':'changed'}">${k}: ${vals.join(' vs ')}</span>`;}).join('');}

  // Regression verdict
  const base=runs[0],comp=runs[1];
  const costBase=base.llm_efficiency.totals.cost_cny||1,costComp=comp.llm_efficiency.totals.cost_cny||1;
  const costChg=(costComp-costBase)/costBase*100;
  const qualBase=base.review_quality.findings.avg_confidence||0,qualComp=comp.review_quality.findings.avg_confidence||0;
  const qualChg=qualBase>0?(qualComp-qualBase)/qualBase*100:0;
  let verdict='',verdictCls='';
  if(Math.abs(costChg)>15){if(qualChg<-3){verdict='退化 — 成本'+costChg.toFixed(0)+'%，质量'+qualChg.toFixed(0)+'%';verdictCls='regression';}else if(qualChg>3){verdict='权衡 — 成本'+costChg.toFixed(0)+'%，但质量+'+qualChg.toFixed(0)+'%';verdictCls='tradeoff';}else{verdict='退化 — 成本'+costChg.toFixed(0)+'%，质量不变';verdictCls='regression';}}
  else if(costChg<-10){if(qualChg>=-1){verdict='改进 — 成本'+costChg.toFixed(0)+'%，质量持平';verdictCls='improvement';}else{verdict='权衡 — 成本'+costChg.toFixed(0)+'%，但质量'+qualChg.toFixed(0)+'%';verdictCls='tradeoff';}}
  else if(qualChg>5){verdict='改进 — 质量+'+qualChg.toFixed(0)+'%，成本稳定';verdictCls='improvement';}
  else{verdict='无显著变化';verdictCls='neutral';}

  // Metrics table
  const metrics=[['总耗时 (s)','latency.total_wall_clock_secs',v=>v.toFixed(0),true],['LLM 调用','llm_efficiency.totals.llm_calls',v=>v,true],['Token 输入','llm_efficiency.totals.tokens_input',fmtK,true],['Token 输出','llm_efficiency.totals.tokens_output',fmtK,true],['API 成本 (CNY)','llm_efficiency.totals.cost_cny',v=>v.toFixed(2),true],['发现数量','review_quality.findings.after_dedup',v=>v,false],['高严重度','review_quality.findings.by_severity.high',v=>v,false],['浪费率','llm_efficiency.wasted_call_ratio',v=>(v*100).toFixed(0)+'%',true],['置信度','review_quality.findings.avg_confidence',v=>v.toFixed(2),false]];
  let tableHtml='<tr><th style="min-width:120px">指标</th>';for(const l of labels)tableHtml+=`<th style="font-size:11px">${esc(l)}</th>`;tableHtml+='<th style="font-size:10px;color:var(--text3)">范围</th></tr>';
  for(const[name,path,fmt,lowerBetter] of metrics){tableHtml+=`<tr><td class="metric">${name}</td>`;const vals=runs.map(r=>getPath(r,path));const numVals=vals.filter(v=>typeof v==='number');const mn=numVals.length?Math.min(...numVals):0;const mx=numVals.length?Math.max(...numVals):0;for(const v of vals)tableHtml+=`<td>${fmt(v)}</td>`;if(numVals.length>=2&&mn!==mx)tableHtml+=`<td style="font-size:11px"><span class="${lowerBetter?'delta-down':'delta-up'}">${fmt(mn)} → ${fmt(mx)}</span> ${mn!==0?((mx-mn)/mn*100).toFixed(0)+'%':''}</td>`;else tableHtml+=`<td style="color:var(--text3);font-size:11px">—</td>`;tableHtml+='</tr>';}

  document.getElementById('content').innerHTML=`
  <div style="margin-bottom:12px;display:flex;align-items:center;gap:12px"><a href="#list" style="display:flex;align-items:center;gap:4px">${ic('arrow-left','icon-sm')} 返回</a><span style="font-weight:600">对比 ${runs.length} 次实验</span><span style="flex:1"></span><button class="btn sm" onclick="clearCompare();location.hash='list'">清除</button></div>
  ${configDiff?`<div class="chart-box" style="margin-bottom:12px"><h3>配置差异</h3><div class="config-diff">${configDiff}</div></div>`:''}
  <div class="verdict ${verdictCls}">${verdict}</div>
  <div class="chart-box" style="margin-bottom:12px"><h3>指标对比表</h3><div class="table-wrap"><table class="compare-table">${tableHtml}</table></div></div>
  <div class="chart-row col3"><div class="chart-box"><h3>总耗时</h3><canvas id="t1"></canvas></div><div class="chart-box"><h3>Token 输入</h3><canvas id="t2"></canvas></div><div class="chart-box"><h3>API 成本</h3><canvas id="t3"></canvas></div></div>
  <div class="chart-row col3"><div class="chart-box"><h3>发现数量</h3><canvas id="t4"></canvas></div><div class="chart-box"><h3>置信度</h3><canvas id="t5"></canvas></div><div class="chart-box"><h3>浪费率</h3><canvas id="t6"></canvas></div></div>`;

  setTimeout(()=>{
    drawLine('t1',labels,runs,'latency.total_wall_clock_secs','s');
    drawLine('t2',labels,runs,'llm_efficiency.totals.tokens_input','tokens');
    drawLine('t3',labels,runs,'llm_efficiency.totals.cost_cny','CNY');
    drawLine('t4',labels,runs,'review_quality.findings.after_dedup','count');
    drawLine('t5',labels,runs,'review_quality.findings.avg_confidence','conf');
    drawLine('t6',labels,runs,'llm_efficiency.wasted_call_ratio','waste',v=>v*100);
  },80);
}

/* ══════ ANALYSIS ═════════════════════════════════════════════ */
async function renderAnalysis(){
  document.getElementById('content').innerHTML=`<div style="text-align:center;padding:60px;color:var(--text3)">Loading...</div>`;
  try{
    const res=await fetch(API);const data=await res.json();
    const runs=(data.runs||[]).filter(r=>r.total_secs>0);
    if(runs.length<2){document.getElementById('content').innerHTML=`<div class="card" style="text-align:center;padding:60px;color:var(--text3)">需要至少 2 次实验才能分析。</div>`;return;}

    const modelStats={};runs.forEach(r=>{const m=r.llm_model||'?';if(!modelStats[m])modelStats[m]=[];modelStats[m].push(r);});
    const tagStats={};runs.forEach(r=>{(r.tags||[]).forEach(t=>{if(!tagStats[t])tagStats[t]=[];tagStats[t].push(r);});});
    const tagEntries=Object.entries(tagStats).filter(([,v])=>v.length>=2).sort((a,b)=>b[1].length-a[1].length);

    document.getElementById('content').innerHTML=`
    <div style="margin-bottom:12px;display:flex;align-items:center;gap:12px">
      <a href="#list" style="display:flex;align-items:center;gap:4px">${ic('arrow-left','icon-sm')} 返回</a>
      <span style="font-weight:600">交叉实验分析</span><span style="flex:1"></span><span style="font-size:11px;color:var(--text3)">${runs.length} 次实验</span>
    </div>
    <div class="chart-row">
      <div class="chart-box"><h3>${ic('scatter','icon-sm')} Token vs 发现数量</h3><canvas id="scatter1"></canvas></div>
      <div class="chart-box"><h3>${ic('bar-chart','icon-sm')} 模型平均成本</h3><canvas id="modelBars"></canvas></div>
    </div>
    <div class="chart-row">
      <div class="chart-box"><h3>${ic('scatter','icon-sm')} 成本 vs 发现数量</h3><canvas id="scatter2"></canvas></div>
      <div class="chart-box"><h3>${ic('tag','icon-sm')} 标签平均发现数</h3><canvas id="tagBars"></canvas></div>
    </div>`;

    setTimeout(()=>{
      drawScatter('scatter1',runs.map(r=>({x:r.tokens_input,y:r.total_findings})),'Tokens In','Findings');
      drawScatter('scatter2',runs.map(r=>({x:r.cost_cny,y:r.total_findings})),'Cost (CNY)','Findings');
      drawModelBars(modelStats);
      drawTagBars(tagEntries);
    },50);
  }catch(e){document.getElementById('content').innerHTML=`<div class="card" style="padding:40px;color:var(--red)">Load error: ${esc(e.message)}</div>`;}
}

/* ══════ Shared — horizontal bar chart ═══════════════════════════ */
const PALETTE=['#1e3a5f','#1d4ed8','#0f766e','#475569','#5b21b6','#3b82f6','#334155','#0891b2'];
function hexToRgba(h,a){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

function drawHBarChart(id,labels,values,opts={}){
  const el=document.getElementById(id);if(!el)return;
  if(!labels.length){el.outerHTML=`<div style="color:var(--text3);font-size:11px;text-align:center;padding:30px 0">${opts.emptyMsg||'暂无数据'}</div>`;return}
  const ctx=el.getContext('2d');
  const colors=opts.colors||labels.map(()=>opts.color||'#1d4ed8');
  registerChart(new Chart(ctx,{type:'bar',data:{labels,datasets:[{data:values,backgroundColor:colors.map(c=>hexToRgba(c,0.5)),borderColor:colors,borderWidth:1,borderRadius:3,maxBarThickness:36}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},subtitle:opts.subtitle?{display:true,text:opts.subtitle,font:{size:10},color:'#8b95a5',padding:{top:8,bottom:0}}:{display:false},tooltip:{callbacks:{label:ctx=>' '+ctx.raw+(opts.unit||'')}}},scales:{x:{beginAtZero:true,grid:{display:false},ticks:{font:{size:10},color:'#8b95a5',callback:v=>typeof v==='number'?v+(opts.unit||''):v}},y:{grid:{display:false},ticks:{font:{size:10},color:'#5b6578'}}}}}));
}

function drawModelBars(modelStats){
  const entries=Object.entries(modelStats);if(!entries.length)return;
  const data=entries.map(([m,runs])=>({model:m,count:runs.length,avgCost:runs.reduce((s,r)=>s+r.cost_cny,0)/runs.length,avgFind:runs.reduce((s,r)=>s+r.total_findings,0)/runs.length}));
  drawHBarChart('modelBars',data.map(d=>d.model),data.map(d=>d.avgCost),{color:'#1d4ed8',unit:' CNY',subtitle:data.map(d=>d.model+': '+d.count+' 次, ~'+d.avgFind.toFixed(1)+' 发现/次').join(' · '),emptyMsg:'暂无模型数据'});
}

function drawTagBars(tagEntries){
  if(!tagEntries.length)return;
  const data=tagEntries.map(([tag,runs])=>({tag,count:runs.length,avgFind:runs.reduce((s,r)=>s+r.total_findings,0)/runs.length}));
  drawHBarChart('tagBars',data.map(d=>d.tag),data.map(d=>d.avgFind),{colors:data.map((_,i)=>PALETTE[i%PALETTE.length]),emptyMsg:'没有 ≥2 次实验的标签',subtitle:data.map(d=>d.tag+': '+d.count+' runs').join(' · ')});
}

/* ══════ CHARTS — Chart.js ════════════════════════════════════ */
const STAGE_NAMES={document_ingestion:'Ingest',document_structure:'Structure',chunking:'Chunking',embedding:'Embedding',agent_review:'Agent Review',post_processing:'Output'};

function drawStageChart(lat){
  const s=lat.stages||[];if(!s.length)return;
  drawHBarChart('stageChart',s.map(x=>STAGE_NAMES[x.stage]||x.stage),s.map(x=>x.duration_secs),{colors:s.map(x=>x.stage==='agent_review'?'#1d4ed8':'#475569'),unit:'s',emptyMsg:'暂无阶段耗时数据'});
}

function drawAgentChart(llm){
  const el=document.getElementById('agentChart');if(!el)return;
  const a=llm.by_agent||{};const names=Object.keys(a);
  if(!names.length)return;
  const ctx=el.getContext('2d');
  registerChart(new Chart(ctx,{type:'bar',data:{labels:names,datasets:[
    {label:'LLM Calls',data:names.map(n=>a[n].llm_calls),backgroundColor:'rgba(29,78,216,.55)',borderColor:'#1d4ed8',borderWidth:1},
    {label:'Findings',data:names.map(n=>a[n].findings_produced),backgroundColor:'rgba(15,118,110,.55)',borderColor:'#0f766e',borderWidth:1},
    {label:'Wasted',data:names.map(n=>a[n].wasted_calls),backgroundColor:'rgba(185,28,28,.45)',borderColor:'#b91c1c',borderWidth:1}
  ]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:10,boxHeight:10,padding:16,font:{size:10},color:'#5b6578'}}},scales:{x:{grid:{display:false},ticks:{font:{size:10},color:'#8b95a5'}},y:{beginAtZero:true,grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},color:'#8b95a5'}}}}}));
}

function drawPhaseChart(p){
  if(!p.length)return;
  drawHBarChart('phaseChart',p.map(x=>x.phase),p.map(x=>x.duration_secs),{color:'#1d4ed8',unit:'s',emptyMsg:'暂无子阶段数据'});
}

function drawSeverityChart(qual){
  const el=document.getElementById('severityChart');if(!el)return;
  const s=qual.findings.by_severity;
  const ctx=el.getContext('2d');
  registerChart(new Chart(ctx,{type:'doughnut',data:{labels:['High','Medium','Low','Info'],datasets:[{data:[s.high,s.medium,s.low,s.info],backgroundColor:['#b91c1c','#c2410c','#047857','#64748b'],borderColor:'#fff',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:8,boxHeight:8,padding:14,font:{size:10},color:'#5b6578'}}}}}));
}

function drawToolChart(tools){
  if(!tools)return;
  const entries=Object.entries(tools).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(!entries.length)return;
  drawHBarChart('toolChart',entries.map(([k])=>k),entries.map(([,v])=>v),{colors:entries.map((_,i)=>PALETTE[i%PALETTE.length]),emptyMsg:'无工具调用记录'});
}

function drawLine(id,labels,runs,path,yLabel,transform){
  const el=document.getElementById(id);if(!el)return;
  const vals=runs.map(r=>{const v=getPath(r,path);return transform?transform(v):v;});
  const ctx=el.getContext('2d');
  registerChart(new Chart(ctx,{type:'line',data:{labels,datasets:[{data:vals,borderColor:'#1d4ed8',backgroundColor:'rgba(29,78,216,.06)',fill:true,tension:.35,pointRadius:5,pointBackgroundColor:'#1d4ed8',pointBorderColor:'#fff',pointBorderWidth:1.5}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10},color:'#8b95a5'}},y:{title:{display:true,text:yLabel,font:{size:10},color:'#8b95a5'},beginAtZero:path.includes('wasted')||path.includes('cost'),grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},color:'#8b95a5'}}}}}));
}

function drawScatter(id,pts,xLabel,yLabel){
  const el=document.getElementById(id);if(!el)return;
  if(!pts.length)return;
  const ctx=el.getContext('2d');
  registerChart(new Chart(ctx,{type:'scatter',data:{datasets:[{data:pts,backgroundColor:'rgba(29,78,216,.55)',borderColor:'#1d4ed8',borderWidth:1,pointRadius:5}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{x:{title:{display:true,text:xLabel,font:{size:10},color:'#8b95a5'},grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},color:'#8b95a5'}},y:{title:{display:true,text:yLabel,font:{size:10},color:'#8b95a5'},grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},color:'#8b95a5'}}}}}));
}

/* ══════ DATA OPS ═════════════════════════════════════════════ */
async function addTag(runId){const tag=prompt('输入新标签:');if(!tag||!tag.trim())return;const d=await(await fetch(`${API}/${runId}`)).json();await updateTags(runId,[...new Set([...(d.meta.tags||[]),tag.trim()])]);}
async function removeTag(runId,tag){if(!confirm('删除标签 "'+tag+'"?'))return;const d=await(await fetch(`${API}/${runId}`)).json();await updateTags(runId,(d.meta.tags||[]).filter(t=>t!==tag));}
async function updateTags(runId,tags){const res=await fetch(`${API}/${runId}/tags`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({tags})});if(res.ok){toast('标签已更新');route()}else toast('更新失败');}
async function editTitle(runId,current){const nt=prompt('编辑标题（留空恢复默认）:',current===runId.slice(9)?'':current);if(nt===null)return;const res=await fetch(`${API}/${runId}/title`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:nt.trim()||null})});if(res.ok){toast('标题已更新');route()}else toast('更新失败');}
function editNotes(runId){document.getElementById('notes-display').style.display='none';document.getElementById('notes-empty').style.display='none';document.getElementById('notes-editor').style.display='block';document.getElementById('notes-textarea').focus();}
function cancelNotes(){route();}
async function saveNotes(runId){const text=document.getElementById('notes-textarea').value;const res=await fetch(`${API}/${runId}/notes`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({notes:text.trim()||null})});if(res.ok){toast('备注已保存');route()}else toast('保存失败');}
async function moveToGroup(runId,current){const groups=await fetch('/api/v1/metrics/experiment-groups').then(r=>r.json()).then(d=>d.experiment_groups||[]).catch(()=>[]);const ng=prompt('移动到实验组（留空=根目录，新名称=创建）:\n当前: '+(current||'(无)'),current==='(ungrouped)'?'':(current||''));if(ng===null)return;const g=ng.trim();const res=await fetch(`${API}/${runId}/experiment-group`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({experiment_group:g||null})});if(res.ok){toast(g?'已移至 '+g:'已移至根目录');route()}else toast('移动失败');}
async function deleteRun(runId,title){if(!confirm('删除 "'+title+'"?\n此操作不可撤销。'))return;const res=await fetch(`${API}/${runId}`,{method:'DELETE'});if(res.ok){compareSet.delete(runId);updateBadge();toast('已删除');route()}else toast('删除失败');}

/* ══════ HELPERS ══════════════════════════════════════════════ */
function getPath(o,p){return p.split('.').reduce((a,k)=>a?.[k],o)}
function fmtK(n){if(n>=1000)return(n/1000).toFixed(1)+'k';return String(n)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}

route();
</script>
